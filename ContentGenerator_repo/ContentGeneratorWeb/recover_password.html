<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cambio de Contraseña - Generador de Contenido</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

  <header>
    <div class="header-content">
      <div class="left">
        <div class="title2">
          <span id="title-text">Generador de Contenido</span>
        </div>
      </div>
    </div>
  </header>
  <canvas id="bg-canvas"></canvas> <!-- AÑADIDO -->
  <div class="container1">
    <h2>🔐 Recuperar contraseña</h2>

   <div class="section-block">
       <div class="input-wrapper">
            <input type="email" id="email" placeholder="Introduce tu correo" />
       </div>
       <button id="send-code-btn" class="full-width" onclick="sendResetCode()">Enviar código</button>
    </div>

<div id="code-section" class="section-block" style="display:none;">
  <p class="section-title"> Introduce el código recibido</p>
    <div class="input-wrapper">
        <input type="text" id="reset-code" placeholder="Código recibido por correo" />
    </div>
  <button class="full-width" onclick="verifyCode()">Verificar código</button>
</div>

<div id="new-password-section" class="section-block" style="display:none;">
  <p class="section-title"> Establece tu nueva contraseña</p>
  <div class="input-wrapper">
    <input id="password1" type="password" placeholder="Nueva contraseña">
    <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
  </div>

  <div class="input-wrapper">
    <input id="password2" type="password" placeholder="Confirmar contraseña">
    <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
  </div>

  <div class="actions">
    <button class="full-width" onclick="resetPassword()">Cambiar contraseña</button>
  </div>
</div>

    <p id="message"></p>
  </div>
    <script type="module" src="js/config.js" defer></script>
  <script src="js/general.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-actions.js"></script>
  <script src="js/redirect.js"></script>
  <script src="js/recoverPassword.js"></script>
  <script src="js/bg_animation.js"></script>

</body>
</html>

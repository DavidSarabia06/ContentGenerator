<div class="settings-header">
  <h2>⚙️ Ajustes</h2>
  <p class="muted">Gestiona opciones de tu cuenta y preferencias.</p>
</div>

<div class="settings-grid">
  <div class="card">
    <div class="card-head">
      <h3>Seguridad</h3>
      <span class="badge">Cuenta</span>
    </div>
    <p class="muted">Cambia tu contraseña o elimina tu cuenta.</p>
    <div class="actions gap">
      <button class="btn" onclick="navigateTo('settings/change-password')">Cambiar contraseña</button>
      <button class="btn danger" onclick="navigateTo('settings/delete-account')">Eliminar cuenta</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Preferencias</h3>
      <span class="badge outline">Próximamente</span>
    </div>
    <p class="muted"><em>Pendiente de integrar.</em></p>
  </div>
</div>

<div class="settings-header">
  <h2>🔑 Cambiar contraseña</h2>
  <p class="muted">Por seguridad, usa una contraseña robusta.</p>
</div>

<form id="change-password-form" class="form-block card">
  <div class="section-block">
    <label for="oldPass" class="section-title">Contraseña actual</label>
    <div class="input-wrapper">
      <input type="password" id="oldPass" placeholder="Tu contraseña actual" required />
      <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
    </div>
  </div>

  <div class="section-block">
    <label for="newPass" class="section-title">Nueva contraseña</label>
    <div class="input-wrapper">
      <input type="password" id="newPass" placeholder="Nueva contraseña" required />
      <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
    </div>
  </div>

  <div class="section-block">
    <label for="confirmPass" class="section-title">Confirmar nueva contraseña</label>
    <div class="input-wrapper">
      <input type="password" id="confirmPass" placeholder="Repite la nueva contraseña" required />
      <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
    </div>
  </div>

  <div class="actions right gap">
    <button type="button" class="btn ghost" onclick="navigateTo('settings')">← Volver</button>
    <button type="button" onclick="changePassword()" class="btn">Actualizar contraseña</button>
  </div>
</form>
<div id="message" class="muted"></div>

<script src="/js/settings-change-password.js"></script>

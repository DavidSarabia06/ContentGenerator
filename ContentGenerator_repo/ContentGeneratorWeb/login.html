<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión - Generador de Contenido</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <header>
    <div class="header-content">
      <div class="left">
        <div class="title2">
          <span id="title-text">Generador de Contenido</span>
        </div>
      </div>
    </div>
  </header>
  <canvas id="bg-canvas"></canvas> <!-- AÑADIDO -->
  <div class="container1">
    <h2>🔐 Iniciar sesión</h2>

    <!-- 📧 Correo -->
    <div class="input-wrapper">
      <input type="username" id="username" placeholder="Nombre de usuario" required>
    </div>

    <!-- 🔒 Contraseña -->
    <div class="input-wrapper">
      <input type="password" id="password" placeholder="Contraseña" required>
      <span class="eye-icon"><i class="fa-solid fa-eye"></i></span>
    </div>

    <!-- ✅ Recuérdame + Olvidado -->
    <div class="horizontal-container">
        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox" id="remember"> Recuérdame
          </label>
          <div class="forgot-password">
            <a href="recover_password.html">¿Has olvidado tu contraseña?</a>
          </div>
        </div>
    </div>
    <!-- 🔘 Botón de inicio -->
    <div class="actions full-width">
      <button class="full-width" id="loginBtn" onclick="login()">Iniciar sesión</button>
    </div>

   <!-- 🔗 Enlace a registro (centrado, estilo morado) -->
    <p class="register-link">
      ¿No tienes cuenta?
      <a href="register.html">Regístrate aquí</a>
    </p>
    <!-- 📩 Mensaje -->
    <p id="message"></p>
  </div>

  <!-- Scripts -->
  <script src="js/config.js" defer></script>
  <script src="js/general.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-actions.js"></script>
  <script src="js/redirect.js"></script>
  <script src="js/bg_animation.js"></script>
</body>
</html>
